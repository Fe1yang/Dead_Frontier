name: Symbolicate crash offsets (no rebuild)

# Turns TestFlight .ips image offsets into function names using the dSYM artifact of an
# earlier build. ~2 minutes instead of a full 16-40 minute iOS build.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run id that produced the DeadFrontier-dsym artifact'
        required: true
      offsets:
        description: 'Comma/space separated hex image offsets, e.g. 0x15174b4 0x152fbec'
        required: true

jobs:
  symbolicate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
    - name: Download the dSYM artifact of that run
      uses: actions/download-artifact@v4
      with:
        name: DeadFrontier-dsym
        run-id: ${{ inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: symbols

    - name: Unpack and symbolicate
      run: |
        set -e
        ls -laR symbols | head -40
        mkdir -p work
        for z in symbols/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d work; done
        DSYM=$(find work symbols -type f -name DeadFrontier -path '*DWARF*' | head -1)
        echo "dSYM: $DSYM"
        if [ -z "$DSYM" ]; then echo "::error::dSYM binary not found in artifact"; exit 1; fi
        xcrun dwarfdump --uuid "$DSYM" || true
        ADDRS=""
        for off in ${{ inputs.offsets }}; do
          off=$(echo "$off" | tr -d ',')
          [ -z "$off" ] && continue
          ADDRS="$ADDRS $(printf '0x%x' $((0x100000000 + off)))"
        done
        echo "resolving:$ADDRS"
        # shellcheck disable=SC2086
        xcrun atos -o "$DSYM" -arch arm64 -l 0x100000000 $ADDRS
